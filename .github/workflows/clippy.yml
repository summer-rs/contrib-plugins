# Run Clippy on every pull request (and pushes to the default branch).

name: Clippy

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: clippy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: clippy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: summer-ext-macros
            toolchain: stable
          - crate: summer-pubsub
            toolchain: stable
          - crate: summer-sa-token
            toolchain: stable
          - crate: summer-opendal
            toolchain: stable
          # spring-utoipa uses `#![feature(type_alias_impl_trait)]` — needs nightly for clippy.
          - crate: spring-utoipa
            toolchain: nightly

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: cargo clippy
        run: cargo clippy --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings
